[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Warning ambientale di fastapi/starlette 0.143 (consiglia httpx2 per il
    # TestClient): non dipende dal codice di questo repo, si tiene fuori dalla
    # suite perche' resti a zero warning. Ogni ALTRO warning resta visibile.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
