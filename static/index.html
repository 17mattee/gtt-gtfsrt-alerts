<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTT Torino Control Room | Live Fleet</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 380px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1000; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #334155; background: #0f172a; }
        .sidebar-header h1 { font-size: 1.25rem; font-weight: 600; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .sidebar-header p { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
        
        .stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; text-align: center; }
        .stat-box span { display: block; font-size: 1.25rem; font-weight: 700; color: #38bdf8; }
        .stat-box label { font-size: 0.75rem; color: #94a3b8; }

        .feed-section { flex: 1; overflow-y: auto; padding: 15px 20px; }
        .feed-section h3 { font-size: 0.9rem; font-weight: 600; color: #cbd5e1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .alert-card { background: #334155; border-left: 4px solid #f59e0b; padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem; }
        .alert-card strong { color: #facc15; display: block; margin-bottom: 2px; }

        /* Map Container */
        #map { flex: 1; height: 100%; background: #0b0f19; }

        /* Status Badge */
        .status-indicator { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
        .connection-status { padding: 10px 20px; font-size: 0.8rem; background: #0f172a; border-top: 1px solid #334155; display: flex; align-items: center; gap: 8px; color: #94a3b8; }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <h1><span class="status-indicator"></span> GTT Control Room</h1>
            <p>Torino Real-Time Public Transport</p>
        </div>
        
        <div class="stats-container">
            <div class="stat-box">
                <span id="active-vehicles">0</span>
                <label>Mezzi Attivi</label>
            </div>
            <div class="stat-box">
                <span id="active-routes">215</span>
                <label>Linee Ufficiali</label>
            </div>
        </div>

        <div class="feed-section">
            <h3>Avvisi e Deviazioni (Service Alerts)</h3>
            <div id="alerts-container">
                <div class="alert-card">
                    <strong>Nessuna allerta critica</strong>
                    La rete GTT è regolare su tutte le linee urbane e metropolitane.
                </div>
            </div>
        </div>

        <div class="connection-status" id="ws-status">
            Connessione WebSocket in corso...
        </div>
    </aside>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione mappa centrata su Torino
        const map = L.map('map', { zoomControl: false }).setView([45.0703, 7.6869], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dark tile layer pulito (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://carto.com/">CARTO</a> | Dati GTT Torino'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let ws;

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);
            const statusEl = document.getElementById('ws-status');

            ws.onopen = () => {
                statusEl.innerHTML = '<span class="status-indicator" style="background:#22c55e; box-shadow: 0 0 8px #22c55e;"></span> Connesso al WebSocket Live';
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'full_network_update' || message.data) {
                        const data = message.data || message;
                        updateDashboard(data);
                    }
                } catch (err) {
                    console.error("Errore parsing WebSocket:", err);
                }
            };

            ws.onclose = () => {
                statusEl.innerHTML = '<span class="status-indicator" style="background:#ef4444; box-shadow: 0 0 8px #ef4444;"></span> Connessione persa. Riconnessione...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function updateDashboard(data) {
            markersLayer.clearLayers();
            
            const vehicles = data.vehicles || [];
            document.getElementById('active-vehicles').innerText = vehicles.length;

            vehicles.forEach(v => {
                if (v.latitude && v.longitude) {
                    const markerHtml = `<div style="background: #38bdf8; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 6px #38bdf8;"></div>`;
                    const customIcon = L.divIcon({
                        className: 'custom-vehicle-marker',
                        html: markerHtml,
                        iconSize: [14, 14]
                    });

                    const marker = L.marker([v.latitude, v.longitude], { icon: customIcon });
                    marker.bindPopup(`
                        <div style="color: #0f172a; font-family: 'Inter', sans-serif;">
                            <strong>Linea: ${v.route_id}</strong><br>
                            Veicolo ID: ${v.vehicle_id}<br>
                            Velocità: ${(v.speed * 3.6).toFixed(1)} km/h
                        </div>
                    `);
                    markersLayer.addLayer(marker);
                }
            });

            // Aggiorna allerte se presenti
            const alerts = data.alerts || [];
            const alertsContainer = document.getElementById('alerts-container');
            if (alerts.length > 0) {
                alertsContainer.innerHTML = '';
                alerts.forEach(al => {
                    alertsContainer.innerHTML += `
                        <div class="alert-card">
                            <strong>Linea ${al.affected_routes.join(', ') || 'Generale'}</strong>
                            ${al.header}
                        </div>
                    `;
                });
            }
        }

        connectWebSocket();
    </script>
</body>
</html>
